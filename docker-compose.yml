services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      OSRM_BASE_URL: http://osrm:5000
      NOMINATIM_BASE_URL: http://nominatim:8080
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    command: node src/server.js

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      # Host-side port only -- container-to-container traffic (the app
      # service talking to DB_HOST=mysql) always uses 3306 internally on
      # the Docker network regardless of this mapping. Remapped to 3307 on
      # the host side because the native Windows MySQL80 service already
      # owns host port 3306 (used for local `npm run dev`/`npm test`
      # outside Docker) -- both can run side by side this way.
      - "3307:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # OSRM (self-hosted road-network routing). Data preprocessed once via
  # osrm-extract / osrm-partition / osrm-customize against a Mbeya-region
  # OSM extract (see osrm-data/) -- clipped down from the full-country file
  # because the full Tanzania extract OOM-killed on this machine's ~4GB
  # Docker memory ceiling. A regional extract matches the proposal's own
  # scope anyway (simulated test scenarios, not nationwide coverage).
  # osrm-routed just serves the preprocessed result.
  osrm:
    image: osrm/osrm-backend
    restart: unless-stopped
    command: osrm-routed --algorithm mld /data/mbeya-latest.osrm
    ports:
      - "5000:5000"
    volumes:
      - ./osrm-data:/data

  # Nominatim (self-hosted geocoding) -- same OSM extract as OSRM, wired up
  # in Sprint 2 for address search as a convenience alongside click-to-pin.
  # nominatim:
  #   image: mediagis/nominatim:4.4
  #   ports:
  #     - "8080:8080"
  #   volumes:
  #     - ./nominatim-data:/var/lib/postgresql/14/main
