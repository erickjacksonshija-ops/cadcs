services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      OSRM_BASE_URL: http://osrm:5000
      NOMINATIM_BASE_URL: http://nominatim:8080
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    command: node src/server.js

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      # Host-side port only -- container-to-container traffic (the app
      # service talking to DB_HOST=mysql) always uses 3306 internally on
      # the Docker network regardless of this mapping. Remapped to 3307 on
      # the host side because the native Windows MySQL80 service already
      # owns host port 3306 (used for local `npm run dev`/`npm test`
      # outside Docker) -- both can run side by side this way.
      - "3307:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # OSRM (self-hosted road-network routing). Data preprocessed once via
  # osrm-extract / osrm-partition / osrm-customize against a Mbeya-region
  # OSM extract (see osrm-data/) -- clipped down from the full-country file
  # because the full Tanzania extract OOM-killed on this machine's ~4GB
  # Docker memory ceiling. A regional extract matches the proposal's own
  # scope anyway (simulated test scenarios, not nationwide coverage).
  # osrm-routed just serves the preprocessed result.
  osrm:
    # Pinned by digest, not just ':latest' -- osrm/osrm-backend is amd64-only
    # and hasn't been repushed in years, which is fine for an amd64 deploy
    # target (e.g. GitHub Codespaces) but would silently break on an ARM
    # host. Verified: this exact image reads our committed osrm-data/
    # (prepared with OSRM 5.26.0) correctly. If deploying to an ARM host
    # later, ghcr.io/project-osrm/osrm-backend has real arm64 support but
    # uses a newer on-disk data format (5.27.1) incompatible with the
    # committed .osrm files -- would need osrm-extract/partition/customize
    # re-run against that image first, not a drop-in swap.
    image: osrm/osrm-backend@sha256:af5d4a83fb90086a43b1ae2ca22872e6768766ad5fcbb07a29ff90ec644ee409
    restart: unless-stopped
    command: osrm-routed --algorithm mld /data/mbeya-latest.osrm
    ports:
      - "5000:5000"
    volumes:
      - ./osrm-data:/data

  # Scheduled DB backup (see plan: "Data Durability"). Runs scripts/backup-db.sh
  # on a loop rather than needing cron installed on the host -- the mysql:8.0
  # image already ships the matching mysqldump client. DB_* here are passed
  # directly rather than via .env because the real host on this network is
  # "mysql", not whatever a host-side .env has for native `npm run dev`.
  backup:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: 21600 # every 6 hours
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./scripts/backup-db.sh:/backup-db.sh:ro
      - ./backups:/backups
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -e
        while true; do
          bash /backup-db.sh
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done

  # Nominatim (self-hosted geocoding) -- same regional OSM extract as OSRM
  # (osrm-data/mbeya-latest.osm.pbf), backing the dispatcher's address/
  # landmark search (src/services/geocodeService.js). First boot imports
  # the extract into Postgres and takes several minutes (verified: ~15 on
  # this machine, most of it Postgres checkpoint I/O on a bind-mounted
  # volume, not the actual osm2pgsql import which finishes in under a
  # minute for a region this size) -- subsequent starts reuse
  # ./nominatim-data and come up in seconds. geocodeService.js already
  # degrades to an empty result set (dispatcher falls back to click-to-pin)
  # if this service is down or still importing, so it's never a hard
  # dependency for the app to start.
  nominatim:
    image: mediagis/nominatim:4.4
    restart: unless-stopped
    environment:
      PBF_PATH: /nominatim/data.osm.pbf
    ports:
      - "8080:8080"
    volumes:
      - ./osrm-data/mbeya-latest.osm.pbf:/nominatim/data.osm.pbf
      - ./nominatim-data:/var/lib/postgresql/14/main
